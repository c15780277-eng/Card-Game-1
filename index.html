<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Narco Cards: The Gathering — Prototype</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/neon-effects.css">
  <link rel="stylesheet" href="css/menu-style.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="hud">
      <div class="title neon-text">NARCO CARDS: <span class="subtitle">THE GATHERING</span></div>
      <div class="hud-actions">
        <button id="btn-reset" class="pill-btn">Zurücksetzen</button>
      </div>
    </header>

    <!-- top small pillbar to match mobile screenshot -->
    <div class="menu-topbar-fixed">
      <nav class="menu-inline">
        <button class="menu-pill active" data-target="play">PLAY</button>
        <button class="menu-pill" data-target="deck">DECKBUILDER</button>
        <button class="menu-pill" data-target="collection">COLLECTION</button>
        <button class="menu-pill" data-target="shop">SHOP</button>
        <button class="menu-pill" data-target="options">OPTIONS</button>
        <button class="menu-pill" data-target="quit">QUIT</button>
      </nav>
    </div>

    <main class="stage">
      <!-- Main Menu / Intro with left vertical menu to match design -->
      <section id="screen-menu" class="screen active menu-screen">
        <div class="menu-left">
          <ul class="menu-list">
            <li><button id="menu-play" class="left-item active">PLAY</button></li>
            <li><button id="menu-deck" class="left-item">DECKBUILDER</button></li>
            <li><button id="menu-collection" class="left-item">COLLECTION</button></li>
            <li><button id="menu-shop" class="left-item">SHOP</button></li>
            <li><button id="menu-options" class="left-item">OPTIONS</button></li>
            <li><button id="menu-quit" class="left-item">QUIT</button></li>
          </ul>
          <div class="daily-wrap">
            <img src="assets/daily.svg" alt="Daily" class="daily-svg glow-teal">
            <div class="daily-text" id="daily-login">DAILY LOGIN</div>
          </div>
        </div>

        <div class="menu-center">
          <!-- central art / hologram -->
          <div class="holo-card">
            <img src="assets/holo.svg" alt="Hologramm" class="holo-img">
            <h1>Willkommen</h1>
            <p>Ein Kartenspiel‑Prototyp im Neon‑Stil. Wähle links deine Aktion.</p>
            <div class="cta-row">
              <button id="start-play" class="pill-btn">Spielen</button>
              <button id="open-deck" class="pill-btn">Deckbuilder</button>
            </div>
          </div>
        </div>

        <div class="menu-right">
          <!-- optional right visual, left intentionally empty to match art focus -->
        </div>
      </section>

      <!-- Battle Screen -->
      <section id="screen-battle" class="screen">
        <!-- clean battleboard diagram as background layer (no arrows/labels) -->
        <img src="assets/battleboard.svg" alt="Battle Diagram" class="battle-diagram" aria-hidden="true">

        <div class="battle-wrap">
          <div class="opponent-area">
            <div class="opponent-stats">
              <div><strong>Gegner (KI)</strong></div>
              <div>LP: <span id="ai-hp">30</span></div>
              <div>Mana: <span id="ai-mana">0</span>/<span id="ai-maxmana">0</span></div>
            </div>
            <div class="board" id="ai-board"></div>
            <div class="ai-hand" id="ai-hand"></div>
          </div>

          <div class="log-and-controls">
            <div class="life-row">
              <div class="life-label neon-text">LIFE POINTS</div>
              <div class="life-bar"><div id="life-fill"></div></div>
            </div>
            <div class="log" id="game-log"></div>
            <div class="battle-controls">
              <button id="btn-endturn" class="pill-btn">Beenden</button>
              <button id="btn-surrender" class="pill-btn">Aufgeben</button>
            </div>
          </div>

          <div class="player-area">
            <div class="player-stats">
              <div><strong id="player-name">Spieler</strong></div>
              <div>LP: <span id="player-hp">30</span></div>
              <div>Mana: <span id="player-mana">0</span>/<span id="player-maxmana">0</span></div>
              <div>Credits: <span id="player-credits">0</span></div>
            </div>
            <div class="board" id="player-board"></div>
            <div class="hand" id="player-hand"></div>
          </div>
        </div>
      </section>

      <!-- Deckbuilder / Collection / Shop / Options overlays -->
      <aside id="overlay" class="overlay">
        <div class="overlay-header">
          <h2 id="overlay-title">Overlay</h2>
          <div>
            <button id="overlay-close" class="pill-btn">Schließen</button>
          </div>
        </div>
        <div class="overlay-body" id="overlay-body"></div>
      </aside>

    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
