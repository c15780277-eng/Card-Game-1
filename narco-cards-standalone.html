<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Responsive helpers: CSS + JS to improve mobile layout and scale canvases -->
<style>
  /* Base adjustments for mobile */
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: #05070a;
    color: #e8fff2;
    overflow: hidden; /* keep existing behavior */
  }

  /* Container to ensure the game fills the viewport without horizontal scrolling */
  .game-container {
    width: 100vw;
    height: 100vh;
    max-width: 100%;
    max-height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Make images/slices responsive where appropriate */
  img.slice, img { max-width: 100%; height: auto; display: block; }

  /* Ensure stage-wrap stays within viewport (works alongside existing scale rules) */
  .stage-wrap {
    max-width: 100vw;
    max-height: 100vh;
    box-sizing: border-box;
  }

  /* If a canvas with id 'gameCanvas' exists, allow it to scale fluidly */
  canvas#gameCanvas, canvas, .game-viewport, iframe {
    max-width: 100%;
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  /* Touch-friendly controls */
  .control-button, button {
    min-height: 44px;
    min-width: 44px;
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 8px;
    touch-action: manipulation;
  }

  /* Slightly reduce HUD on very small screens */
  @media (max-width: 420px) {
    .hud, .hud-credits { transform: scale(0.95); }
    .toast { font-size: 14px; padding: 10px 18px; }
    .back-btn { width: 80px; height:36px; font-size:13px; }
  }

  /* Portrait specific padding */
  @media (orientation: portrait) and (max-width: 768px) {
    .game-container { padding: 8px; }
  }
</style>

<script>
(function(){
  // Resize helper for a <canvas id="gameCanvas"> if present.
  function resizeGameCanvas() {
    var canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    var DPR = window.devicePixelRatio || 1;

    // Use available viewport size
    var maxWidth = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    var maxHeight = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

    // Set device pixel perfect backing store
    canvas.width = Math.floor(maxWidth * DPR);
    canvas.height = Math.floor(maxHeight * DPR);

    // Set CSS size the user sees
    canvas.style.width = maxWidth + 'px';
    canvas.style.height = maxHeight + 'px';

    var ctx = canvas.getContext && canvas.getContext('2d');
    if (ctx && typeof ctx.setTransform === 'function') {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    // Call game-specific resize handler if available
    if (window.game && typeof window.game.onResize === 'function') {
      try { window.game.onResize(maxWidth, maxHeight, DPR); } catch(e) { console.warn('game.onResize error', e); }
    }
  }

  var debounce;
  window.addEventListener('load', function(){ resizeGameCanvas(); setTimeout(resizeGameCanvas, 300); });
  window.addEventListener('resize', function(){ clearTimeout(debounce); debounce = setTimeout(resizeGameCanvas, 80); });
  window.addEventListener('orientationchange', function(){ setTimeout(resizeGameCanvas, 200); });
})();
</script>

<title>Narco Cards: The Gathering</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --neon: #8ff5c9;
    --neon-glow: rgba(143,245,201,0.85);
    --red: #ff4d4d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#05070a;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow:hidden;
  }
  body{
    display:flex; align-items:center; justify-content:center;
  }

  /* Scales the fixed 1024x1024 stage to fit the viewport, keeping it crisp */
  .stage-wrap{
    width:100vmin; height:100vmin;
    position:relative;
  }
  .stage{
    position:absolute; top:0; left:0;
    width:1024px; height:1024px;
    transform-origin: top left;
    transform: scale(calc(100vmin / 1024));
  }

  .screen{
    position:absolute; top:0; left:0;
    width:1024px; height:1024px;
    opacity:0;
    pointer-events:none;
    transition: opacity .5s ease;
  }
  .screen.active{
    opacity:1;
    pointer-events:auto;
  }

  .slice{
    position:absolute;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }

  /* interactive hotspots sit on top of the baked-in art */
  .hotspot{
    position:absolute;
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
    pointer-events:auto;
  }
  .hotspot img{
    width:100%; height:100%; display:block;
    filter: drop-shadow(0 0 0px var(--neon-glow));
    transition: filter .18s ease, transform .18s ease;
  }
  .hotspot:hover img,
  .hotspot:focus-visible img{
    filter: drop-shadow(0 0 14px var(--neon-glow)) brightness(1.25);
    transform: scale(1.035);
  }
  .hotspot:active img{
    transform: scale(0.98);
    filter: drop-shadow(0 0 6px var(--neon-glow)) brightness(0.95);
  }
  .hotspot:focus-visible{
    outline: 2px solid var(--neon);
    outline-offset: 2px;
    border-radius: 6px;
  }

  .icon-hotspot{
    border-radius: 18%;
  }
  .icon-hotspot img{
    filter: drop-shadow(0 0 0px var(--neon-glow));
  }
  .icon-hotspot:hover img{
    filter: drop-shadow(0 0 20px var(--neon-glow)) brightness(1.3);
    transform: scale(1.06);
  }

  /* toast / feedback */
  .toast{
    position:absolute;
    left:50%; bottom:56px;
    transform: translate(-50%, 20px);
    background: rgba(6,14,12,0.92);
    border:1px solid var(--neon);
    color: var(--neon);
    padding: 14px 28px;
    font-size:20px;
    letter-spacing:1px;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(143,245,201,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    white-space:nowrap;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform: translate(-50%, 0);
  }

  .back-btn{
    position:absolute;
    top: 24px; left: 24px;
    width: 96px; height:40px;
    border: 1px solid var(--neon);
    color: var(--neon);
    background: rgba(0,0,0,0.35);
    font-size: 14px;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor:pointer;
    z-index: 20;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .back-btn:hover{
    background: rgba(143,245,201,0.15);
    box-shadow: 0 0 16px rgba(143,245,201,0.4);
  }

  /* transparent overlays: the visible label/graphic is already baked into
     the art, these just add the interactive behaviour on top of it */
  .name-input{
    position:absolute;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--neon);
    font-size: 13px;
    padding: 0 8px;
    letter-spacing: 1px;
    outline:none;
    z-index: 15;
    transition: background .18s ease, border-color .18s ease;
  }
  .name-input::placeholder{ color: transparent; }
  .name-input:hover, .name-input:focus{
    background: rgba(143,245,201,0.12);
    border-color: rgba(143,245,201,0.6);
  }

  .ghost-hotspot{
    position:absolute;
    background: transparent;
    border: none;
    border-radius: 6px;
    cursor:pointer;
    z-index: 15;
    transition: background .18s ease, box-shadow .18s ease;
  }
  .ghost-hotspot:hover, .ghost-hotspot:focus-visible{
    background: rgba(143,245,201,0.1);
    box-shadow: 0 0 16px rgba(143,245,201,0.25) inset;
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
</style>
<style>
/* ============================================================
   style-app.css
   Zusätzliche Styles für die neuen funktionalen Screens
   (Deckbuilder, Shop, Kampf, Kartensammlung-Grid).
   Diese Overlays liegen über der 1024x1024-Bühne und sind
   selbst responsive/scrollbar, damit sie auf jedem Gerät
   nutzbar sind (nicht nur auf der festen Stage-Auflösung).
   ============================================================ */

.overlay {
  position: fixed;
  inset: 0;
  background: #05070a;
  z-index: 1000;
  display: none;
  flex-direction: column;
  color: #e8fff2;
  font-family: 'Segoe UI', Arial, sans-serif;
}
.overlay.active { display: flex; }

.overlay-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid rgba(143, 245, 201, 0.25);
  flex: 0 0 auto;
}
.overlay-header h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 1px;
  color: var(--neon, #8ff5c9);
}
.overlay-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 16px 18px 100px;
  -webkit-overflow-scrolling: touch;
}

.pill-btn {
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--neon, #8ff5c9);
  color: var(--neon, #8ff5c9);
  border-radius: 999px;
  padding: 8px 18px;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: background .15s ease, box-shadow .15s ease;
}
.pill-btn:hover { background: rgba(143,245,201,0.15); box-shadow: 0 0 14px rgba(143,245,201,0.35); }
.pill-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.pill-btn.primary { background: rgba(143,245,201,0.18); }

.hud-credits {
  font-size: 13px;
  color: #ffce6b;
  letter-spacing: 0.5px;
}

/* --- Card grid (Collection / Deckbuilder) --- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.tc-card {
  position: relative;
  border-radius: 10px;
  padding: 10px 8px 8px;
  background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(0,0,0,0.35));
  border: 2px solid var(--rarity-color, #9fb3ad);
  box-shadow: 0 0 0 rgba(0,0,0,0);
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
  user-select: none;
}
.tc-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
.tc-card.selected { box-shadow: 0 0 0 3px var(--rarity-color, #8ff5c9) inset, 0 0 18px var(--rarity-color, #8ff5c9); }
.tc-card .tc-art {
  height: 64px;
  border-radius: 6px;
  margin-bottom: 6px;
  background: radial-gradient(circle at 30% 20%, color-mix(in srgb, var(--rarity-color, #8ff5c9) 55%, #05070a), #05070a);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.tc-card .tc-name {
  font-size: 11.5px;
  line-height: 1.25;
  min-height: 28px;
  font-weight: 600;
}
.tc-card .tc-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-top: 6px;
  color: #cfe;
}
.tc-card .tc-rarity {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--rarity-color, #9fb3ad);
  margin-top: 2px;
}
.tc-card .tc-power { color: #ff8a8a; font-weight: 700; }
.tc-card .tc-defense { color: #7fd0ff; font-weight: 700; }

.empty-hint {
  opacity: 0.6;
  font-size: 13px;
  padding: 24px 4px;
  text-align: center;
}

/* rest of styles unchanged... */
</style>
</head>
